services:
  - type: web
    name: northstar-student-planner
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_COUNTRY
        value: LK
      - key: PADDLE_ENV
        value: sandbox
      - key: PADDLE_MERCHANT_APPROVED
        value: "false"
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        sync: false
